name: shearwater
channels:
- conda-forge
- nodefaults
dependencies:
- pip
- python>=3.10,<3.12
- pywps>=4.7,<4.8
- jinja2
- click
- psutil
- pandas
- xarray
- netcdf4
- requests
- aiohttp
- ipykernel
- scipy
- birdy
# Conda TensorFlow 2.15 pins ICU 73, incompatible with the deployment's libpq.
# The pip wheel preserves Keras 2 compatibility without that native-library pin.
- pip:
  - tensorflow>=2.15,<2.16
- numpy>=1.26,<2
# tests
- pytest
- pandoc
- metview
- metview-python
- matplotlib
